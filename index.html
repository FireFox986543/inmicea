<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INMICEA – Master webpage generator</title>
    <meta name="author" content="FireFox986453, aka HP">
    <link rel="stylesheet" href="src/inmicea-page/fontawesome/css/fontawesome.css">
    <link rel="stylesheet" href="src/inmicea-page/fontawesome/css/regular.css">
    <link rel="stylesheet" href="src/inmicea-page/fontawesome/css/solid.css">
    <link rel="stylesheet" href="src/inmicea-page/fontawesome/css/brands.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>INMICEA</h1>
        <h2>The new generation webpage generator</h2>
        <a href="https://github.com/FireFox986543/inmicea" target="_blank" rel="noreferrer noopener"><i class="fab fa-github"></i></a>
    </header>
    <main>
        <div id="editor">
            <div id="top-toolbar">
                <button type="button" class="control-btn green-btn" onclick=""><i class="fas fa-play"></i> Preview</button>
                <div style="flex-grow: 1;"></div>
                <button type="button" class="control-btn selector-btn">
                    <i class="fas fa-plus"></i>
                    <div class="card-selector-wrapper">
                        <div class="card-selector">
                            <div class="selector-option" onclick="addCardRoot(new HeaderCard()); renderCards();"><i class="fas fa-heading"></i> Header</div>
                            <div class="selector-option" onclick="addCardRoot(new SectionCard()); renderCards();"><i class="fas fa-section"></i> Section</div>
                            <div class="selector-option" onclick="addCardRoot(new ContactInfoCard()); renderCards();"><i class="fas fa-id-card"></i> Contact Info</div>
                            <div class="selector-option" onclick="addCardRoot(new ContactFormCard()); renderCards();"><i class="fas fa-inbox-in"></i> Contact Form</div>
                        </div>
                    </div>
                </button>
            </div>
            <div id="editor-content" class="card-container">
            </div>
        </div>
        <div id="viewer">
            <iframe id="window-frame" src="src/inmicea-page/index.html" frameborder="0" style="width: 133.333%; height: 133.333%; overflow: hidden;"></iframe>
        </div>
    </main>


    <script src="cards.js"></script>
    <script src="script.js"></script>
</body>

</html>
