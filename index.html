<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INMICEA – Master webpage generator</title>
    <meta name="author" content="FireFox986453, aka HP">
    <link rel="stylesheet" href="src/inmicea-page/fontawesome/css/fontawesome.css">
    <link rel="stylesheet" href="src/inmicea-page/fontawesome/css/regular.css">
    <link rel="stylesheet" href="src/inmicea-page/fontawesome/css/solid.css">
    <link rel="stylesheet" href="src/inmicea-page/fontawesome/css/brands.css">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="src/favicon.png" type="image/x-icon">
</head>

<body>
    <header>
        <h1>INMICEA</h1>
        <h2>The new generation webpage generator</h2>
        <a class="git-icon" href="https://github.com/FireFox986543/inmicea" target="_blank" rel="noreferrer noopener"><i class="fab fa-github"></i></a>
        <a class="right-side theme-icon" href="javascript:void(0);" rel="noreferrer noopener" onclick="toggleTheme()"></a>
        <a class="right-side" href="javascript:void(0);" style="left: 72px; font-size: 1.2rem;" rel="noreferrer noopener" onclick="switchSide()"><i class="fas fa-square-half-stroke"></i></a>
    </header>
    <main>
        <div id="editor">
            <div id="top-toolbar">
                <button type="button" class="control-btn purple-btn tooltip" tooltip-text="Save" onclick="saveToHistory(true)"><i class="fas fa-save"></i></button>
                <button type="button" class="control-btn blue-btn tooltip" tooltip-text="Download" onclick="downloadPage()"><i class="fas fa-file-arrow-down"></i></button>
                <button type="button" class="control-btn blue-btn tooltip" tooltip-text="Open in newtab" onclick="previewNewPage()"><i class="fas fa-arrow-up-right-from-square"></i></button>
                <button type="button" class="control-btn green-btn" onclick="preview()"><i class="fas fa-play"></i> Preview</button>
                <div style="flex-grow: 1;"></div>
                <button type="button" class="control-btn tooltip" tooltip-text="Undo changes" onclick="historyUndo()"><i class="fas fa-arrow-turn-left"></i></button>
                <button type="button" class="control-btn tooltip" tooltip-text="Redo changes" onclick="historyRedo()"><i class="fas fa-arrow-turn-right"></i></button>
                <button type="button" class="control-btn selector-btn">
                    <i class="fas fa-plus"></i>
                    <div class="card-selector-wrapper">
                        <div class="card-selector">
                            <div class="selector-option" onclick="addCardIntoList(null, null, new HeaderCard())"><i class="fas fa-heading"></i> Header</div>
                            <div class="selector-option" onclick="addCardIntoList(null, null, new SectionCard())"><i class="fas fa-section"></i> Section</div>
                            <div class="selector-option" onclick="addCardIntoList(null, null, new ContactInfoCard())"><i class="fas fa-id-card"></i> Contact Info</div>
                            <div class="selector-option" onclick="addCardIntoList(null, null, new ContactFormCard())"><i class="fas fa-inbox-in"></i> Contact Form</div>
                            <div class="selector-option" onclick="addCardIntoList(null, null, new RawHTMLCard())"><i class="fas fa-file-html"></i> Raw HTML Card</div>
                        </div>
                    </div>
                </button>
            </div>
            <div id="editor-content" class="card-container">
            </div>
        </div>
        <div id="viewer">
            <iframe id="window-frame" src="src/inmicea-page/index.html" frameborder="0" style="width: 133.333%; height: 133.333%; overflow: hidden;"></iframe>
        </div>
    </main>

    <div id="modal" class="hidden">
        <div class="content">
            <h1>Continue previous session?</h1>
            <p>There's saved data from last time. Would you like to continue, or start a new one?</p>
            <div class="modal-btns">
                <button type="button" class="control-btn white-btn" onclick="restoreSession();">Continue editing</button>
                <button type="button" class="control-btn red-btn" onclick="createNew();">Start new</button>
            </div>
        </div>
    </div>

    <script src="cards.js"></script>
    <script src="script.js"></script>
</body>

</html>
