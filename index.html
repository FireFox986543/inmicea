<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INMICEA – Master webpage generator</title>
    <meta name="author" content="FireFox986453, aka HP">
    <link rel="stylesheet" href="src/inmicea-page/fontawesome/css/fontawesome.css">
    <link rel="stylesheet" href="src/inmicea-page/fontawesome/css/regular.css">
    <link rel="stylesheet" href="src/inmicea-page/fontawesome/css/solid.css">
    <link rel="stylesheet" href="src/inmicea-page/fontawesome/css/brands.css">
    <link rel="stylesheet" href="src/style.css">
    <link rel="shortcut icon" href="src/favicon.png" type="image/x-icon">
    <script src="src/scripts/interface.js"></script>
</head>

<body>
    <div class="main-panel">
        <div class="toolbar-panel collapsed">
            <button type="button" class="control-btn flippy-btn" onclick="interface.toggleSidebar(this)"><i class="fas fa-chevron-left flippy-icon"></i></button>
            <div class="toolbar-top toolbar-hiding">
                <img src="src/icon.svg" alt="I" draggable="false">
                <h1>INMICEA</h1>
            </div>
            <div class="toolbar-buttons toolbar-hiding">
                <button type="button" class="control-btn tooltip" tooltip-text="Create new project" data-trkey="create_project|tt" onclick="createProjectBtnClick()"><i class="fas fa-plus"></i></button>
                <button type="button" class="control-btn tooltip" tooltip-text="Create new draft" data-trkey="create_draft|tt" onclick="createDraftBtnClick()"><i class="fas fa-sheet-plastic"></i></button>
            </div>
            <div class="toolbar-hiding" id="project-container">
            </div>
            <div class="toolbar-collapsed-panel toolbar-hiding-reversed hidden" id="current-project-displayer"></div>
        </div>
        <div style="flex-grow: 1; min-width: 0;">
            <header>
                <h1>INMICEA</h1>
                <h2 data-trkey="tit2">The new generation webpage generator</h2>
                <!--<a class="git-icon" href="https://github.com/FireFox986543/inmicea" target="_blank" rel="noreferrer noopener"><i class="fab fa-github"></i></a>-->
                <div class="floating-container">
                    <a class="float-button theme-icon" href="javascript:void(0);" rel="noreferrer noopener" onclick="theme.toggleTheme()"></a>
                    <a class="float-button" href="javascript:void(0);" onclick="interface.switchSide()"><i class="fas fa-square-half-stroke"></i></a>
                    <a class="float-button selector-btn dropover-right" href="javascript:void(0);">
                        <i class="fas fa-language"></i>
                        <div class="dropover-selector-wrapper">
                            <div class="dropover-selector">
                                <div class="selector-option" onclick="setLanguage(0)"><i class="fas fa-sterling-sign"></i> <span data-trkey="english">English</span></div>
                                <div class="selector-option" onclick="setLanguage(1)"><i class="fas fa-pepper-hot"></i> <span data-trkey="hungarian">Hungarian</span></div>
                            </div>
                        </div>
                    </a>
                </div>
            </header>
            <main>
                <div id="editor">
                    <div id="top-toolbar">
                        <button type="button" class="control-btn purple-btn tooltip" tooltip-text="Save" data-trkey="save|tt" onclick="saveBtnClick()"><i class="fas fa-save"></i></button>
                        <button type="button" class="control-btn blue-btn tooltip" tooltip-text="Download" data-trkey="download|tt" onclick="downloadPage()"><i class="fas fa-file-arrow-down"></i></button>
                        <button type="button" class="control-btn blue-btn tooltip" tooltip-text="Open in newtab" data-trkey="open_newtab|tt" onclick="previewNewPage()"><i class="fas fa-arrow-up-right-from-square"></i></button>
                        <button type="button" class="control-btn green-btn" onclick="preview()"><i class="fas fa-play"></i> <span data-trkey="preview" class="hide-800">Preview</span></button>
                        <div style="flex-grow: 1;"></div>
                        <button type="button" class="control-btn tooltip" tooltip-text="Undo changes" data-trkey="undo|tt" onclick="historyUndo()"><i class="fas fa-arrow-turn-left"></i></button>
                        <button type="button" class="control-btn tooltip" tooltip-text="Redo changes" data-trkey="redo|tt" onclick="historyRedo()"><i class="fas fa-arrow-turn-right"></i></button>
                        <button type="button" class="control-btn tooltip" tooltip-text="Collapse/expand all" data-trkey="collapse_expand|tt" onclick="collapseExpandAll()"><i class="fas fa-compress"></i></button>
                        <button type="button" class="control-btn selector-btn">
                            <i class="fas fa-plus"></i>
                            <div class="dropover-selector-wrapper">
                                <div class="dropover-selector">
                                    <div class="selector-option" onclick="addCardIntoList(null, null, new HeaderCard())"><i class="fas fa-heading"></i> <span data-trkey="header_card">Header</span></div>
                                    <div class="selector-option" onclick="addCardIntoList(null, null, new SectionCard())"><i class="fas fa-section"></i> <span data-trkey="section_card">Section</span></div>
                                    <div class="selector-option" onclick="addCardIntoList(null, null, new ContactInfoCard())"><i class="fas fa-id-card"></i> <span data-trkey="contact_info_card">Contact Info</span></div>
                                    <div class="selector-option" onclick="addCardIntoList(null, null, new ContactFormCard())"><i class="fas fa-inbox-in"></i> <span data-trkey="contact_form_card">Contact Form</span></div>
                                    <div class="selector-option" onclick="addCardIntoList(null, null, new GalleryCard())"><i class="fas fa-image-stack"></i> <span data-trkey="gallery_card">Gallery Card</span></div>
                                    <div class="selector-option" onclick="addCardIntoList(null, null, new RawHTMLCard())"><i class="fas fa-file-html"></i> <span data-trkey="raw_html_card">Raw HTML Card</span></div>
                                </div>
                            </div>
                        </button>
                    </div>
                    <div id="editor-content" class="card-container">
                    </div>
                </div>
                <div id="viewer">
                    <iframe id="window-frame" src="src/inmicea-page/index.html" frameborder="0" style="width: 133.333%; height: 133.333%; overflow: hidden;"></iframe>
                </div>
            </main>
        </div>
    </div>

    <div id="modal" class="hidden">
        <div class="content">
            <h1></h1>
            <p></p>
            <div class="modal-btns">
                <button type="button" id="modal-button-0" class="control-btn white-btn" onclick="modals.modalButtonClicked(0)"></button>
                <button type="button" id="modal-button-1" class="control-btn red-btn" onclick="modals.modalButtonClicked(1)"></button>
            </div>
        </div>
    </div>

    <script src="src/scripts/helpers.js"></script>
    <script src="src/scripts/translator.js"></script>
    <script src="src/scripts/cards.js"></script>
    <script src="src/scripts/script.js"></script>
    <script src="src/scripts/projects.js"></script>
</body>

</html>
